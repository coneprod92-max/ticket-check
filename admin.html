<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TicketCheck — Administration</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="navbar">
  <a class="logo" href="index.html">Ticket<span>Check</span></a>
  <button class="nav-btn" id="logoutBtn">Déconnexion</button>
</header>
<main class="form-page">
  <section class="form-card">
    <div id="loginBox">
      <span class="eyebrow">ESPACE ADMIN</span>
      <h1>Connexion</h1>
      <form id="loginForm">
        <div class="field"><label>Email</label><input id="email" type="email" value="coneprod92@gmail.com" required></div>
        <div class="field"><label>Mot de passe</label><input id="password" type="password" required></div>
        <button class="submit-btn" type="submit">Se connecter</button>
        <p id="loginMessage" class="form-message"></p>
      </form>
    </div>
    <div id="dashboard" style="display:none">
      <span class="eyebrow">TABLEAU DE BORD</span>
      <h1>Demandes reçues</h1>
      <div id="requests"></div>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
